<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <title>Diff Playground</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>±</text></svg>" />
  </head>
  <body>
    <div id="app">
      <header class="header">
        <div class="header-left">
          <h1 class="logo">diff<span class="logo-accent">playground</span></h1>
        </div>
        <div class="header-right">
          <button class="theme-btn" id="themeToggle" aria-label="Toggle theme">
            <svg class="icon-sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
            <svg class="icon-moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
          </button>
        </div>
      </header>

      <main class="main">
        <div class="editors">
          <div class="editor-pane">
            <div class="editor-header">
              <span class="editor-label">Original</span>
            </div>
            <textarea id="original" class="editor" spellcheck="false" placeholder="Paste original text here..."></textarea>
          </div>
          <div class="editor-pane">
            <div class="editor-header">
              <span class="editor-label">Modified</span>
            </div>
            <textarea id="modified" class="editor" spellcheck="false" placeholder="Paste modified text here..."></textarea>
          </div>
        </div>

        <div class="toolbar">
          <button class="btn btn-secondary" id="clearBtn">Clear</button>
          <button class="btn btn-secondary" id="swapBtn">Swap</button>
          <div class="stats" id="stats"></div>
        </div>

        <div class="diff-section">
          <div class="diff-header">
            <div class="view-toggle">
              <button class="toggle-btn active" data-view="split">Split</button>
              <button class="toggle-btn" data-view="unified">Unified</button>
            </div>
            <div class="stats" id="diffStats"></div>
          </div>
          <div class="diff-output" id="diffOutput">
            <div class="diff-placeholder">
              Start typing to see the diff
            </div>
          </div>
        </div>
      </main>

      <footer class="footer">
        <p>Powered by <a href="https://www.npmjs.com/package/diff" target="_blank" rel="noopener">jsdiff</a> &middot; Design inspired by <a href="https://diffs.com" target="_blank" rel="noopener">diffs.com</a></p>
      </footer>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
